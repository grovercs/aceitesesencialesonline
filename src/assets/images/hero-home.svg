<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="60%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#heroGrad)" />

  <!-- Decoración: hojas y círculos -->
  <circle cx="200" cy="200" r="140" fill="#bbf7d0" opacity="0.4" />
  <circle cx="1700" cy="850" r="200" fill="#86efac" opacity="0.3" />
  <g opacity="0.25">
    <path d="M150,300 Q180,220 220,250 Q260,280 230,340 Q200,400 150,300" fill="#22c55e" />
    <path d="M1700,650 Q1740,580 1780,620 Q1820,660 1770,720 Q1720,780 1700,650" fill="#16a34a" />
  </g>

  <!-- Difusor estilizado -->
  <g transform="translate(1300,520)">
    <!-- Base -->
    <ellipse cx="0" cy="180" rx="120" ry="30" fill="#d1d5db" />
    <rect x="-80" y="80" width="160" height="110" rx="20" fill="#e5e7eb" />
    <rect x="-60" y="60" width="120" height="40" rx="10" fill="#f3f4f6" />
    <ellipse cx="0" cy="60" rx="60" ry="15" fill="#d1d5db" />
    <!-- Vapor -->
    <path d="M-20,40 Q-40,-20 -10,-60" stroke="#9ca3af" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.6" />
    <path d="M10,40 Q30,-30 0,-80" stroke="#9ca3af" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5" />
    <path d="M35,40 Q50,-10 30,-50" stroke="#9ca3af" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Botella de aceite -->
  <g transform="translate(1500,680)">
    <rect x="-25" y="0" width="50" height="90" rx="8" fill="#a7f3d0" opacity="0.8" />
    <rect x="-15" y="-20" width="30" height="25" rx="4" fill="#6ee7b7" />
    <rect x="-20" y="-30" width="40" height="12" rx="3" fill="#10b981" />
    <circle cx="-10" cy="35" r="5" fill="#059669" />
    <circle cx="10" cy="55" r="5" fill="#059669" />
  </g>

  <!-- Texto hero -->
  <text x="220" y="420" font-family="system-ui, sans-serif" font-size="84" font-weight="800" fill="#14532d">Tu guía confiable sobre</text>
  <text x="220" y="520" font-family="system-ui, sans-serif" font-size="84" font-weight="800" fill="#16a34a">aceites esenciales</text>
  <text x="220" y="620" font-family="system-ui, sans-serif" font-size="36" fill="#374151">Aprende a usar la aromaterapia de forma segura, consciente y basada en evidencia.</text>
</svg>
