<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="h1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#h1)" />

  <g transform="translate(240,315)">
    <!-- Casa -->
    <path d="M-120,80 L0,-60 L120,80" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="-90" y="80" width="180" height="100" fill="#fb923c" />
    <rect x="-30" y="120" width="60" height="60" rx="4" fill="#fff7ed" />
    <circle cx="0" cy="40" r="25" fill="#f97316" />
    <path d="M-12,28 L0,40 L12,28" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Difusor -->
    <ellipse cx="160" cy="130" rx="45" ry="12" fill="#d1d5db" />
    <rect x="130" y="80" width="60" height="55" rx="10" fill="#e5e7eb" />
    <rect x="140" y="65" width="40" height="20" rx="5" fill="#f3f4f6" />
    <path d="M150,60 Q140,30 155,10" stroke="#9ca3af" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6" />
  </g>

  <text x="730" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="58" fill="#9a3412" font-weight="800">Usos en el hogar</text>
  <text x="730" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="58" fill="#c2410c" font-weight="800">Difusores, limpieza y recetas</text>
  <text x="730" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#374151">Integra la aromaterapia en tu día a día</text>
</svg>
