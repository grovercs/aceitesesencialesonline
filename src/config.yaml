site:
  name: Aceites Esenciales Online
  site: 'https://aceitesesencialesonline.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ~

# Default SEO metadata
metadata:
  title:
    default: Aceites Esenciales Online
    template: '%s — Aceites Esenciales Online'
  description: 'Guías prácticas de aromaterapia, comparativas de difusores y recomendaciones de aceites esenciales. Contenido independiente para usar el bienestar natural con confianza.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Aceites Esenciales Online
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@AceitesOnline_'
    site: '@AceitesOnline_'
    cardType: summary_large_image

i18n:
  language: es
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/blog/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: 'G-348KY4HVRV'

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
